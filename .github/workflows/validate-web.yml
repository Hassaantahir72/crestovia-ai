name: Validate Web App
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test configuration preflight
        run: node --test ../../scripts/preflight.test.mjs
      - name: Test deployment smoke checks
        run: node --test ../../scripts/health-smoke.test.mjs
      - name: Test database backup verification helper
        run: node --test ../../scripts/verify-db-backup.test.mjs
      - name: Run ESLint
        run: npm run lint
      - name: Build Next.js app
        run: npm run build
