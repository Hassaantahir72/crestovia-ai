name: Validate Web App
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test_key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test public landing page regression checks
        run: node --test ../../scripts/landing-page.test.mjs
      - name: Test workspace onboarding regression checks
        run: node --test ../../scripts/workspace-creation-ui.test.mjs
      - name: Test password recovery flow guards
        run: node --test ../../scripts/password-recovery.test.mjs
      - name: Test private admin panel security guards
        run: node --test ../../scripts/admin-panel-security.test.mjs
      - name: Test WhatsApp webhook security primitives
        run: node --test ../../scripts/whatsapp-webhook-runtime.test.mjs
      - name: Run web configuration preflight
        run: npm run preflight
      - name: Test configuration preflight
        run: node --test ../../scripts/preflight.test.mjs
      - name: Test deployment smoke checks
        run: node --test ../../scripts/health-smoke.test.mjs
      - name: Test database backup verification helper
        run: node --test ../../scripts/verify-db-backup.test.mjs
      - name: Test read-only tenant isolation acceptance runner
        run: node --test ../../scripts/tenant-isolation-acceptance.test.mjs
      - name: Test opt-in staging tenant mutation acceptance runner
        run: node --test ../../scripts/tenant-isolation-mutation-acceptance.test.mjs
      - name: Test read-only provider connectivity helper
        run: node --test ../../scripts/provider-connectivity-check.test.mjs
      - name: Test live Groq completion smoke helper (mocked)
        run: node --test ../../scripts/groq-live-smoke.test.mjs
      - name: Test real assistant provider guardrails
        run: node --test ../../scripts/ai-provider-guardrails.test.mjs
      - name: Test production-readiness report
        run: node --test ../../scripts/readiness-report.test.mjs
      - name: Validate production-readiness checklist structure
        run: npm run readiness:validate
      - name: Run ESLint
        run: npm run lint
      - name: Type-check TypeScript
        run: npx tsc --noEmit
      - name: Build Next.js app
        run: npm run build
