name: Package full source
on:
  push:
    branches: [main, chore/render-build-gates-api-service-v034, security/company-hardening-v1, security/production-acl-rollout-plan-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Create complete source archive outside the checkout
        run: zip -r /tmp/crestovia-ai-source.zip . -x '.git/*' -x 'node_modules/*' -x '**/node_modules/*' && cp /tmp/crestovia-ai-source.zip crestovia-ai-source.zip
      - name: Verify archive contents and secret patterns
        run: python scripts/verify-source-archive.py crestovia-ai-source.zip
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: crestovia-ai-source
          path: crestovia-ai-source.zip
          retention-days: 7
